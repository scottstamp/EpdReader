manifest:
  remotes:
    - name: ncs
      url-base: https://github.com/nrfconnect

  projects:
    # nRF Connect SDK. Importing it pulls in the matching sdk-zephyr fork
    # and the modules this app needs. Only used to create a workspace from
    # scratch (CI); local builds with an installed NCS ignore this file.
    - name: nrf
      remote: ncs
      repo-path: sdk-nrf
      revision: v3.4.1
      import:
        # Only the projects the build actually uses (checked against
        # zephyr_modules.txt of a full-NCS build: same zephyr.bin), so CI
        # doesn't clone all of NCS. Add a module here if a new Kconfig
        # option needs one (e.g. littlefs, mbedtls, mcuboot).
        name-allowlist:
          - zephyr
          - nrfxlib     # SoftDevice Controller, MPSL
          - hal_nordic  # nrfx
          - cmsis_6
          - fatfs

  self:
    path: nrf_epd

manifest:
  remotes:
    - name: ncs
      url-base: https://github.com/nrfconnect

  projects:
    # nRF Connect SDK. Importing it pulls in the matching sdk-zephyr fork
    # and all required modules (hal_nordic, mcuboot, littlefs, fatfs, ...).
    - name: nrf
      remote: ncs
      repo-path: sdk-nrf
      revision: v3.4.1
      import: true

  self:
    path: nrf_epd
